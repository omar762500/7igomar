<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام إدارة الحجاج 2026</title>
<style>
:root{--navy:#173246;--gold:#c99a52;--paper:#f5f2eb;--card:#fffdf8;--line:#e5ded3;--muted:#7c8583}
body{margin:0;background:var(--paper);color:var(--navy);font-family:Tahoma,Arial,sans-serif}
.shell{max-width:900px;margin:auto;padding:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.actions{display:flex;gap:5px}button{cursor:pointer;padding:8px 12px;border-radius:6px;border:1px solid var(--line);background:#fff}
.primary{background:var(--gold);color:white;border:none}
table{width:100%;border-collapse:collapse;margin-top:20px}th,td{border:1px solid #ccc;padding:10px;text-align:right}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);place-items:center;padding:20px}
.modal.open{display:grid}.box{background:white;padding:20px;border-radius:12px;width:100%;max-width:500px}
@media print{.no-print{display:none}}
</style>
</head>
<body>
<div class="shell">
    <h1>سجل الحجاج 2026</h1>
    <div style="margin-bottom:20px">
        <input type="text" id="search" placeholder="بحث بالاسم أو المندوب..." style="padding:10px;width:70%">
        <button class="primary" onclick="openModal()">+ إضافة جديد</button>
    </div>
    <div id="grid"></div>
</div>

<!-- Modal -->
<div class="modal" id="modal">
    <div class="box">
        <h2 id="modalTitle">إضافة حاج</h2>
        <input type="hidden" id="editIndex">
        <input id="personName" placeholder="اسم الحاج" style="width:100%;padding:8px;margin-bottom:10px">
        <input id="note" placeholder="اسم المندوب/التبعية" style="width:100%;padding:8px;margin-bottom:10px">
        <input type="file" id="file" accept="image/*" style="margin-bottom:10px">
        <div style="display:flex;gap:10px">
            <button onclick="closeModal()">إلغاء</button>
            <button class="primary" onclick="saveRecord()">حفظ البيانات</button>
        </div>
    </div>
</div>

<script>
let records = JSON.parse(localStorage.getItem('hajj_data') || '[]');

function render() {
    const q = document.getElementById('search').value.toLowerCase();
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    records.filter(r => r.name.toLowerCase().includes(q) || r.note.toLowerCase().includes(q)).forEach((r, i) => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
            <div onclick="showDetails(${i})" style="cursor:pointer">
                <strong>${r.name}</strong><br><small style="color:gray">${r.note}</small>
            </div>
            <div class="actions">
                <button onclick="editRecord(${i})">تعديل</button>
                <button onclick="deleteRecord(${i})" style="color:red">حذف</button>
            </div>
        `;
        grid.appendChild(div);
    });
}

function saveRecord() {
    const name = document.getElementById('personName').value;
    const note = document.getElementById('note').value;
    const index = document.getElementById('editIndex').value;
    const fileInput = document.getElementById('file');
    
    if(!name) return alert('اكتب الاسم');

    const record = { name, note, image: '' };
    
    if(fileInput.files.length > 0) {
        const reader = new FileReader();
        reader.onload = (e) => {
            record.image = e.target.result;
            finishSave(record, index);
        };
        reader.readAsDataURL(fileInput.files[0]);
    } else {
        record.image = index !== '' ? records[index].image : '';
        finishSave(record, index);
    }
}

function finishSave(record, index) {
    if(index !== '') records[index] = record;
    else records.push(record);
    localStorage.setItem('hajj_data', JSON.stringify(records));
    closeModal();
    render();
}

function deleteRecord(i) { if(confirm('هل أنت متأكد؟')) { records.splice(i, 1); localStorage.setItem('hajj_data', JSON.stringify(records)); render(); } }

function editRecord(i) {
    document.getElementById('editIndex').value = i;
    document.getElementById('personName').value = records[i].name;
    document.getElementById('note').value = records[i].note;
    openModal();
}

function showDetails(i) {
    const r = records[i];
    const win = window.open("", "_blank");
    win.document.write(`
        <div style="text-align:center;font-family:sans-serif">
            <h1>${r.name}</h1>
            <p>التبعية: ${r.note}</p>
            ${r.image ? `<img src="${r.image}" style="max-width:300px"><br><a href="${r.image}" download="image.jpg">تحميل الصورة</a>` : 'لا توجد صورة'}
        </div>
    `);
}

function openModal() { document.getElementById('modal').classList.add('open'); }
function closeModal() { 
    document.getElementById('modal').classList.remove('open');
    document.getElementById('editIndex').value = '';
    document.getElementById('personName').value = '';
    document.getElementById('note').value = '';
}

document.getElementById('search').oninput = render;
render();
</script>
</body>
</html>
