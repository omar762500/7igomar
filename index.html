<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الحج 2026</title>
<style>
:root{--navy:#173246;--gold:#c99a52;--paper:#f5f2eb;--card:#fffdf8;--line:#e5ded3;--muted:#7c8583}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--navy);font-family:Tahoma,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1150px;margin:auto;padding:22px 16px}.header{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center;font-weight:bold}.mark{background:var(--navy);color:var(--gold);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:25px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.tools{display:flex;gap:8px}.icon{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--navy)}h1{font-size:31px;margin:37px 0 5px}.subtitle{color:var(--muted);font-size:13px;margin:0}.hero{margin-top:26px;padding:24px;border-radius:18px;background:var(--navy);color:white;display:flex;justify-content:space-between;align-items:center}.hero h2{margin:0;font-size:24px;line-height:1.6}.hero b{color:#e2bd72}.hero p{margin:5px 0 0;color:#c8d2d1;font-size:12px}.primary{background:var(--gold);color:var(--navy);border:0;border-radius:9px;padding:12px 16px;font-weight:bold}.summary{display:flex;gap:12px;margin:16px 0}.groups{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.group{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:11px}.group b{font-size:16px;margin-right:5px}.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px}.stat span{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;font-size:31px;margin-top:11px}.bar{display:flex;gap:9px;align-items:center;margin-top:25px}.search{flex:1;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--navy);padding:12px}.download,.clear{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--navy);padding:12px 14px}.clear{display:none}.section-head{display:flex;justify-content:space-between;align-items:end;margin:28px 0 14px}.section-head h3{margin:0;font-size:18px}.section-head small{color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;overflow:hidden}.preview{height:150px;background:linear-gradient(135deg,#e9dfca,#dce5e2);display:grid;place-items:center;font-size:48px;color:var(--navy);overflow:hidden}.preview img{width:100%;height:100%;object-fit:cover}.body{padding:14px}.label{color:#b07c34;font-size:10px}.body h4{font-size:15px;margin:7px 0}.body p{margin:0;color:var(--muted);font-size:11px}.foot{border-top:1px solid var(--line);margin-top:13px;padding-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--muted)}.pdf{border:0;background:transparent;color:var(--navy);font-weight:bold}.empty{border:1px dashed #cdbfae;border-radius:15px;text-align:center;padding:55px 20px;color:var(--muted)}.empty strong{display:block;color:var(--navy);font-size:16px;margin-bottom:7px}.modal{display:none;position:fixed;inset:0;background:#173246aa;place-items:center;padding:16px}.modal.open{display:grid}.box{background:var(--card);border-radius:16px;padding:22px;width:min(440px,100%)}.box h2{margin:0 0 15px}.box label{display:block;color:var(--muted);font-size:11px;margin:12px 0}.box input{display:block;width:100%;margin-top:6px;padding:11px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--navy)}.upload{border:1px dashed var(--gold);border-radius:10px;padding:24px;text-align:center;color:var(--muted);font-size:12px;margin:14px 0;cursor:pointer}.actions{display:flex;gap:8px;justify-content:flex-start}.secondary{border:0;background:#eee8de;color:var(--navy);border-radius:9px;padding:11px 15px}.dark{--paper:#111e28;--card:#172936;--navy:#f2efe7;--line:#29404c;--muted:#a8b1ad}.dark .mark{background:#c99a52;color:#173246}.dark .hero{background:#0c1820}.dark .preview{background:linear-gradient(135deg,#304650,#24353b)}@media(max-width:700px){.shell{padding:18px 13px}.header{align-items:flex-start}h1{font-size:25px;margin-top:28px}.hero{display:block;padding:20px}.hero .primary{margin-top:16px}.summary{gap:7px}.stat{padding:12px}.stat strong{font-size:25px}.stat span{font-size:10px}.bar{flex-wrap:wrap}.search{flex-basis:100%;order:-1}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.preview{height:105px}.body{padding:10px}.body h4{font-size:12px}.body p{font-size:9px}.foot{font-size:8px}}
@media print{.tools,.hero,.summary,.bar,.section-head .download,.pdf{display:none!important}.shell{padding:0}.card{break-inside:avoid}.grid{grid-template-columns:repeat(2,1fr);gap:12px}body{background:white}}
</style>
</head>
<body>
<div class="shell">
<header class="header"><div class="brand"><span class="mark">⌒</span><div>الحج 2026<small>سجل المستندات</small></div></div><div class="tools"><button class="icon" id="theme">◐</button><button class="icon" id="clearData">⌫</button></div></header>
<h1>ملفات الحجاج</h1>
<section class="hero"><div><h2>ملفات الحجاج<br><b>الحج 2026</b></h2></div><button class="primary" id="addButton">＋ إضافة مستند</button></section>
<section class="summary"><div class="stat"><span>عدد الأشخاص</span><strong id="total">00</strong></div><div class="stat"><span>صور مرفوعة</span><strong id="uploaded">00</strong></div><div class="stat"><span>بدون صورة</span><strong id="missing">00</strong></div></section><div class="groups" id="groups"></div>
<div class="bar"><input class="search" id="search" placeholder="بحث"><button class="clear" id="clear">مسح البحث</button><button class="download" id="exportData">حفظ نسخة</button><button class="download" id="importButton">استيراد</button><input id="importFile" type="file" accept=".json,application/json" hidden><button class="download" id="printAll">↓ طباعة الكشف</button></div>
<div class="section-head"><div><h3>المستندات <small id="count"></small></h3></div></div>
<section class="grid" id="grid"></section><div class="empty" id="empty"><strong>لا توجد ملفات</strong></div>
</div>
<div class="modal" id="modal"><div class="box"><h2>إضافة مستند</h2><label>اسم صاحب الجواز أو البطاقة<input id="personName" placeholder="اكتب الاسم هنا"></label><label>تبع مين<input id="note" placeholder="اسم المندوب أو الجهة"></label><label class="upload" for="file">اضغط لاختيار صورة المستند<input id="file" type="file" accept="image/*,.pdf" hidden></label><div class="actions"><button class="secondary" id="cancel">إلغاء</button><button class="primary" id="save">حفظ المستند</button></div></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script><script>firebase.initializeApp({apiKey:'AIzaSyCJq-_6e37VJAQxjM94T1-FnjyhPMEB4Rw',authDomain:'hijjomar-bbcab.firebaseapp.com',databaseURL:'https://hijjomar-bbcab-default-rtdb.firebaseio.com',projectId:'hijjomar-bbcab',storageBucket:'hijjomar-bbcab.firebasestorage.app',messagingSenderId:'89660230512',appId:'1:89660230512:web:35c0a77a2687db75561db5'});var cloudDb=firebase.database();var cloudStorage=firebase.storage();</script><script>
var records=[];try{records=JSON.parse(localStorage.getItem('hajj2026_records_v2')||'[]')}catch(e){records=[]}var grid=document.getElementById('grid');var empty=document.getElementById('empty');var search=document.getElementById('search');var clear=document.getElementById('clear');function persist(){try{localStorage.setItem('hajj2026_records_v2',JSON.stringify(records))}catch(e){alert('مساحة التخزين ممتلئة أو غير متاحة في هذا المتصفح')}}function loadCloud(){cloudDb.ref('hajj2026/records').once('value').then(function(s){var data=s.val()||{};records=Object.keys(data).map(function(k){return Object.assign({id:k},data[k])});persist();refresh()}).catch(function(e){console.warn('Firebase read failed',e)})}function saveCloud(record){var ref=cloudDb.ref('hajj2026/records').push();record.id=ref.key;return ref.set(record)}function clearCloud(){return cloudDb.ref('hajj2026/records').remove()}loadCloud();
function refresh(){var q=search.value.trim().toLowerCase();var shown=records.filter(function(r){return !q||(r.name+' '+r.note).toLowerCase().indexOf(q)>=0});grid.innerHTML='';empty.style.display=shown.length?'none':'block';clear.style.display=q?'block':'none';document.getElementById('count').textContent=shown.length;document.getElementById('total').textContent=String(records.length).padStart(2,'0');document.getElementById('uploaded').textContent=String(records.filter(function(r){return r.image}).length).padStart(2,'0');document.getElementById('missing').textContent=String(records.filter(function(r){return !r.image}).length).padStart(2,'0');var tally={};records.forEach(function(r){var key=r.note||'بدون تبعية';tally[key]=(tally[key]||0)+1});document.getElementById('groups').innerHTML=Object.keys(tally).map(function(k){return '<div class="group">'+k+' <b>'+tally[k]+'</b></div>'}).join('');shown.forEach(function(r,i){var card=document.createElement('article');card.className='card';var visual=r.image?'<img src="'+r.image+'" alt="صورة المستند">':'▤';card.innerHTML='<div class="preview">'+visual+'</div><div class="body"><span class="label">ملف '+String(i+1).padStart(2,'0')+' · '+(r.note||'مستند')+'</span><h4>'+r.name+'</h4><div class="foot"><span>'+ (r.image?'● صورة مرفوعة':'! بدون صورة')+'</span><button class="pdf">↓ PDF</button></div></div>';card.querySelector('.pdf').onclick=function(){printOne(r)};grid.appendChild(card)})}
function openModal(){document.getElementById('modal').classList.add('open')};function closeModal(){document.getElementById('modal').classList.remove('open')};function save(){var name=document.getElementById('personName').value.trim();if(!name){alert('اكتب اسم صاحب المستند');return}var f=document.getElementById('file').files[0];var finish=function(image){var record={name:name,note:document.getElementById('note').value.trim(),image:image||'',createdAt:Date.now()};records.unshift(record);persist();saveCloud(record).catch(function(e){alert('تعذر الحفظ على Firebase: تأكد من تفعيل Realtime Database والقواعد')});document.getElementById('personName').value='';document.getElementById('note').value='';document.getElementById('file').value='';closeModal();refresh()};if(f&&f.type.indexOf('image')===0){var reader=new FileReader();reader.onload=function(e){var path='hajj2026/'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');cloudStorage.ref(path).putString(e.target.result,'data_url').then(function(s){return s.ref.getDownloadURL()}).then(function(url){finish(url)}).catch(function(){finish('')})};reader.readAsDataURL(f)}else{finish('')}}
function printOne(r){var old=document.body.innerHTML;document.body.innerHTML='<main style="font-family:Arial;direction:rtl;padding:30px"><h1>الحج 2026</h1><h2>'+r.name+'</h2><p>تبع مين: '+ (r.note||'غير محدد')+'</p></main>';window.print();document.body.innerHTML=old;bind();refresh()}
function printAll(){if(!records.length){alert('لا توجد ملفات للطباعة بعد');return}window.print()};function exportData(){var data={app:'الحج 2026',version:2,createdAt:new Date().toISOString(),records:records};var blob=new Blob([JSON.stringify(data)],{type:'application/json'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='hajj-2026-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000)};function importData(file){if(!file)return;var reader=new FileReader();reader.onload=function(e){try{var data=JSON.parse(e.target.result);if(!data||!Array.isArray(data.records))throw new Error('invalid');records=data.records;persist();refresh();alert('تم استيراد النسخة بنجاح')}catch(err){alert('ملف النسخة غير صحيح')}};reader.readAsText(file)}
function bind(){document.getElementById('addButton').onclick=openModal;document.getElementById('cancel').onclick=closeModal;document.getElementById('save').onclick=save;document.getElementById('theme').onclick=function(){document.body.classList.toggle('dark')};document.getElementById('printAll').onclick=printAll;document.getElementById('exportData').onclick=exportData;document.getElementById('importButton').onclick=function(){document.getElementById('importFile').click()};document.getElementById('importFile').onchange=function(e){importData(e.target.files[0]);e.target.value=''};search.oninput=refresh;clear.onclick=function(){search.value='';refresh()};document.getElementById('clearData').onclick=function(){if(confirm('مسح كل البيانات والصور المحفوظة؟')){records=[];persist();clearCloud().then(refresh).catch(refresh)}}}
bind();refresh();
</script>
</body>
</html>
